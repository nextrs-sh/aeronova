# Milestone 7: the deployment as the Docker end-to-end journey runs it.
#
#   COMPOSE_FILE=compose.yaml:compose.e2e.yaml pnpm docker:up && pnpm test:docker
#
# Same images and hardening as compose.yaml. Differences, all for deterministic synthetic tests:
# "today" is pinned (inventory and prices are then fixed), demo registration is open (the
# journey creates an account), and edge rate limits are raised for a single test client.
# Payment outcome controls and fault injection stay OFF: every simulated payment is approved,
# exactly as in production.
services:
  velasia-api:
    environment:
      VELASIA_TODAY: '2026-12-01'
      ACCOUNT_REGISTRATION: enabled
  velasia-web:
    build:
      args:
        VELASIA_TODAY: '2026-12-01'
    environment:
      VELASIA_TODAY: '2026-12-01'
  velasia-proxy:
    environment:
      VELASIA_RATE_LIMIT_RPS: '500'
      VELASIA_RATE_LIMIT_BURST: '1000'
      VELASIA_POST_RATE_LIMIT_RPS: '100'
      VELASIA_POST_RATE_LIMIT_BURST: '200'
