# Velasia Airways — reverse proxy (Milestone 7). nginx-unprivileged: runs as uid 101 on :8080,
# with a read-only root filesystem (temporary files and the rendered config live in /tmp).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # One JSON line per request: correlation id, route path (no query string, which can carry
  # search details), status, and timings. No cookies, no authorisation headers, no bodies.
  log_format velasia_json escape=json
    '{"time":"$time_iso8601","service":"velasia-proxy","requestId":"$request_id",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"requestTimeS":$request_time,"upstreamTimeS":"$upstream_response_time",'
    '"upstreamStatus":"$upstream_status","rateLimit":"$limit_req_status"}';
  access_log /dev/stdout velasia_json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;

  # Docker's embedded DNS: re-resolve the web service if its container is replaced.
  resolver 127.0.0.11 valid=10s ipv6=off;

  include /tmp/nginx/conf.d/*.conf;
}
